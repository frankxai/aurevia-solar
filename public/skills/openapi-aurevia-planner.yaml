openapi: 3.1.0
info:
  title: Aurevia Planner API — WITHDRAWN
  version: 0.2.0
  description: |
    WITHDRAWN 2026-08-19 / ZURÜCKGEZOGEN 2026-08-19.

    Version 0.1 of this specification described API behavior that does not
    exist: a warehouse-stock endpoint (/stock returns 410 Gone) and a dossier
    endpoint that claimed to return guaranteed, warehouse-checked allocations
    (/api/dossier now returns 410 Gone). Do not call these endpoints and do not
    rely on any earlier version of this file.

    No reservations, allocations, or stock statements from any earlier version
    are valid. A corrected release, if any, will appear at
    https://aurevia-solar.vercel.app/shop together with published capability
    evidence.
paths: {}
